<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 440" role="img" aria-label="Seal of the Dickinson Economics Review">
  <style>@import url("https://fonts.googleapis.com/css2?family=EB+Garamond:wght@600&amp;display=swap"); text { font-family: "EB Garamond", Georgia, serif; }</style>
  <defs>
    <path id="band-top" d="M109.6,387.8 A150,190 0 1,1 250.4,387.8"/>
    <path id="band-bot" d="M27.0,296.8 A165,205 0 0,0 333.0,296.8"/>
  </defs>
  <!-- Band: heavy outer line, single inner line -->
  <ellipse cx="180" cy="220" rx="172" ry="212" fill="#fff" stroke="#111" stroke-width="5"/>
  <ellipse cx="180" cy="220" rx="146" ry="186" fill="none" stroke="#111" stroke-width="2.2"/>

  <text font-size="23" font-weight="600" letter-spacing="1.5" fill="#111">
    <textPath href="#band-bot" startOffset="50%" text-anchor="middle">· MMXXVI ·</textPath>
  </text>

  <!-- Caduceus, standing behind the book and poking out below it -->
  <g stroke="#111" stroke-linecap="round" stroke-linejoin="round" transform="translate(0 12)">
    <path d="M180,66 V298" stroke-width="9"/>
    <path d="M180,66 V298" stroke="#fff" stroke-width="4"/>
    <circle cx="180" cy="302" r="5.5" fill="#fff" stroke-width="2.8"/>
    <circle cx="180" cy="60" r="8" fill="#fff" stroke-width="3"/>
    <g id="wing" fill="#fff" stroke-width="2.6">
      <path d="M176,84 C158,66 130,56 96,58 C106,64 112,68 117,72 C106,72 98,75 92,81 C104,83 114,85 121,87 C113,90 107,94 104,99 C126,98 154,96 176,94 Z"/>
      <path d="M118,73 C134,77 152,83 172,89 M122,87 C138,89 156,90 172,91" fill="none" stroke-width="1.3"/>
    </g>
    <use href="#wing" transform="translate(360 0) scale(-1 1)"/>
    <g fill="none">
      <path d="M180,150 C202,140 202,124 180,116 C158,108 160,98 174,94" stroke-width="8.5"/>
      <path d="M180,150 C202,140 202,124 180,116 C158,108 160,98 174,94" stroke="#fff" stroke-width="3.6"/>
      <path d="M180,150 C158,140 158,124 180,116 C202,108 200,98 186,94" stroke-width="8.5"/>
      <path d="M180,150 C158,140 158,124 180,116 C202,108 200,98 186,94" stroke="#fff" stroke-width="3.6"/>
    </g>
    <ellipse cx="172" cy="94" rx="6" ry="4" fill="#fff" stroke-width="2.4" transform="rotate(-20 172 94)"/>
    <ellipse cx="188" cy="94" rx="6" ry="4" fill="#fff" stroke-width="2.4" transform="rotate(20 188 94)"/>
  </g>


  <!-- Skeleton key lying sideways beneath the book -->
  <g stroke="#111" stroke-linejoin="round" stroke-linecap="round">
    <!-- shaft -->
    <path d="M138,322 H270 C276,322 276,334 270,334 H138 Z" fill="#fff" stroke-width="3.2"/>
    <!-- bit with wards, hanging below the shaft -->
    <path d="M234,334 V362 H243 V353 H250 V362 H258 V351 H266 V334" fill="#fff" stroke-width="3.2"/>
    <!-- collars -->
    <rect x="141" y="316" width="8" height="24" rx="3.5" fill="#fff" stroke-width="3"/>
    <rect x="153" y="316" width="8" height="24" rx="3.5" fill="#fff" stroke-width="3"/>
    <!-- bow: trefoil loops behind a ring with a quatrefoil piercing -->
    <g fill="#fff" stroke-width="3.2">
      <circle cx="90" cy="328" r="11"/><circle cx="114" cy="304" r="11"/><circle cx="114" cy="352" r="11"/>
    </g>
    <g fill="#fff" stroke-width="2">
      <circle cx="88" cy="328" r="4.8"/><circle cx="114" cy="302" r="4.8"/><circle cx="114" cy="354" r="4.8"/>
    </g>
    <circle cx="114" cy="328" r="22" fill="#fff" stroke-width="3.6"/>
    <circle cx="114" cy="328" r="15" fill="#fff" stroke-width="2"/>
    <g fill="#111" stroke="none">
      <circle cx="114" cy="321" r="4.4"/><circle cx="114" cy="335" r="4.4"/>
      <circle cx="107" cy="328" r="4.4"/><circle cx="121" cy="328" r="4.4"/>
      <circle cx="114" cy="328" r="2.6"/>
    </g>
  </g>

  <!-- Open book bearing the motto -->
  <g stroke="#111" stroke-linejoin="round" transform="translate(0 12)">
    <path d="M180,156 C150,144 112,144 74,152 L72,262 C112,254 150,254 180,266 C210,254 248,254 288,262 L286,152 C248,144 210,144 180,156 Z" fill="#111" stroke-width="2.5" transform="translate(0 6)"/>
    <path d="M180,152 C150,140 112,140 78,148 L78,254 C112,246 150,246 180,258 Z" fill="#fff" stroke-width="3"/>
    <path d="M180,152 C210,140 248,140 282,148 L282,254 C248,246 210,246 180,258 Z" fill="#fff" stroke-width="3"/>
    <path d="M180,152 V258" stroke-width="2.4"/>
    <path d="M82,250 C114,243 150,243 178,254 M282,250 C246,243 210,243 182,254" fill="none" stroke-width="1"/>
  </g>
  <g font-size="22" font-weight="600" fill="#111" text-anchor="middle" transform="translate(0 12)">
    <text x="129" y="193">ΓΝΩΘΙ</text>
    <text x="129" y="228" textLength="88" lengthAdjust="spacingAndGlyphs">ΣΕΑΥΤΟΝ</text>
    <text x="231" y="193">ΜΗΔΕΝ</text>
    <text x="231" y="228">ΑΓΑΝ</text>
  </g>
  <!-- Split at the middle dot so it sits exactly at the top and each half fills its own side -->
  <g font-size="27" font-weight="600" fill="#111">
    <text><textPath href="#band-top" startOffset="27" textLength="423" lengthAdjust="spacing">SIGILLVM · EPHEMERIDIS</textPath></text>
    <text><textPath href="#band-top" startOffset="461" text-anchor="middle">·</textPath></text>
    <text><textPath href="#band-top" startOffset="472" textLength="423" lengthAdjust="spacing">OECONOMIAE · DICKINSONII</textPath></text>
  </g>
</svg>
